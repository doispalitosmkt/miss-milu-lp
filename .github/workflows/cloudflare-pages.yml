name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "lp/**"
      - ".github/workflows/cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare Cloudflare Pages files
        shell: bash
        run: |
          mkdir -p .cloudflare-pages-dist
          cp -a lp/. .cloudflare-pages-dist/
          rm -f .cloudflare-pages-dist/assets/portfolio/carrossel/07-velas-e-saboaria/20240724_112851.mp4

      - name: Deploy landing page
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.120.1"
          command: >-
            pages deploy .cloudflare-pages-dist
            --project-name=miss-milu-lp
            --branch=main
            --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
