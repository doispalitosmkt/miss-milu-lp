name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "lp/**"
      - "functions/**"
      - "integracoes/**"
      - ".github/workflows/cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare Cloudflare Pages files
        shell: bash
        run: |
          mkdir -p .cloudflare-pages-dist
          cp -a lp/. .cloudflare-pages-dist/
          rm -f .cloudflare-pages-dist/assets/portfolio/carrossel/07-velas-e-saboaria/20240724_112851.mp4

      # Chave do envio de leads ao CRM da agência (2P). Vem do segredo LEAD_2P_SECRET do repositório
      # e vai para o Cloudflare como segredo cifrado; nunca aparece no log. Sem o segredo, o passo é pulado.
      - name: Configure 2P CRM secret
        env:
          LEAD_2P_SECRET: ${{ secrets.LEAD_2P_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [ -z "$LEAD_2P_SECRET" ]; then echo "LEAD_2P_SECRET não configurado: envio ao CRM 2P segue desligado"; exit 0; fi
          printf '%s' "$LEAD_2P_SECRET" | npx --yes wrangler@4.120.1 pages secret put LEAD_2P_SECRET --project-name=miss-milu-lp

      - name: Deploy landing page
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.120.1"
          command: >-
            pages deploy .cloudflare-pages-dist
            --project-name=miss-milu-lp
            --branch=main
            --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
